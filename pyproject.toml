[project]
name = "glass-lpo"
version = "0.1.0"
description = "Photo of a glass drawing in, checkable LPO (Excel + PDF) out."
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pydantic>=2.6",
    "google-genai>=3.6.1,<3.7",  # uses private _transformers.t_schema
    "openpyxl>=3.1",
    "reportlab>=4.1",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
glass-lpo = "glass_lpo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["glass_lpo"]
